version: "3.8"

services:
  redis:
    image: redis:latest
    container_name: redis-restaurent
    ports:
      - "6379:6379"
    networks:
      - restaurant-network
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:7.0
    container_name: mongodb-restaurant
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=root
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restaurant-network
  restaurant-api-service:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: restaurant-api
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://admin:root@mongodb:27017/restaurant?authSource=admin
    depends_on:
      - redis
      - mongodb
    networks:
      - restaurant-network
    volumes:
      - uploads_data:/app/src/uploads
    
networks:
   restaurant-network:
    external: true
volumes:
  uploads_data:
    driver: local
  redis_data:
    driver: local
  mongo_data:
    driver: local
  
